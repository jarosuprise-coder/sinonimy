<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Синонимы</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <header>
    <form id="searchForm" autocomplete="off">
      <input id="search" type="search" placeholder="Найти синонимы к слову…" aria-label="Слово для поиска">
    </form>
  </header>

  <main>
    <div id="status" class="status">Загружаю словарь…</div>
    <div id="lemmas" class="lemmas" hidden></div>
    <ul id="list" class="list" aria-live="polite"></ul>
  </main>

  <footer>
    Выделите слово или поставьте в него курсор. Клик по синониму заменяет слово, можно пробовать варианты подряд.
    <span class="muted">Словарь синонимов Н. Абрамова. Окончания подстраиваются у прилагательных.</span>
  </footer>

  <script src="synonyms.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
